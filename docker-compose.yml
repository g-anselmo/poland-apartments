services:
  db:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teste123
      POSTGRES_DB: poland_apartments
    volumes:
      - "./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql"
      - "./data:/data"
      - "./sql/02_load_data.sql:/docker-entrypoint-initdb.d/02_load_data.sql"
      - "./sql/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql"
